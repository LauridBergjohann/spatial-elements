<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title description">
<title id="title">Card media fit and constrained text reserve</title><desc id="description">A regular square card has a 4 to 3 media fit. At 142 pixels square, 44 pixels are reserved for two text lines and padding; a smaller 130.67 by 98 media rectangle fits above.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18344b;font-size:18px}.title{font-size:23px;font-weight:600}.label{font-size:20px;font-weight:600}.card{fill:#fff;stroke:#577a96;stroke-width:2}.fit{fill:#b5d8ea;stroke:#27688e;stroke-width:2}.text{fill:#e6edf3}</style>
<rect width="1100" height="520" fill="#fafcfe"/><text class="title" x="32" y="42">Square cards reserve readable text before fitting undistorted media</text>
<rect class="card" x="48" y="90" width="320" height="320" rx="12"/><rect class="fit" x="49" y="91" width="318" height="238"/><rect class="text" x="49" y="330" width="318" height="79"/>
<text class="label" x="108" y="207">4:3 media fit</text><text x="105" y="373">Actual text block</text><text x="64" y="450">Normal allocation: upper ¾ media</text>
<rect class="card" x="596" y="90" width="320" height="320" rx="12"/>
<rect class="fit" x="609" y="91" width="294" height="220"/><rect class="text" x="597" y="311" width="318" height="98"/>
<text class="label" x="670" y="192">Still 4:3</text><text x="639" y="229">130.67 × 98 CSS px</text><text x="647" y="353">Title line 1 · 20px</text><text x="647" y="384">Title line 2 · 20px</text>
<path d="M940 311h20v98h-20" fill="none" stroke="#577a96" stroke-width="2"/><text x="972" y="350">44px</text><text x="972" y="377">reserve</text>
<text x="585" y="450">Small M card: 142 × 142 CSS px</text><text x="585" y="480">Illustration enlarged to compare allocation, not actual size.</text>
</svg>
