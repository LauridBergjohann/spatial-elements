<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450"><rect width="800" height="450" fill="#f3f6f9"/><g font-family="system-ui,sans-serif" fill="#172330"><text x="32" y="34" font-size="22" font-weight="600">Media ratio and text height are independent</text><g transform="translate(60 76)"><rect width="220" height="304" rx="12" fill="white" stroke="#aebaca"/><rect x="8" y="8" width="204" height="204" fill="#dbe9f8"/><text x="110" y="95" text-anchor="middle" font-size="20">1:1 media</text><text x="110" y="124" text-anchor="middle" font-size="14">8px fitting inset</text><path d="M0 220h220" stroke="#aebaca"/><text x="12" y="246" font-size="12" fill="#2369ad">EYEBROW ROW</text><text x="12" y="266" font-size="14">Two title lines</text><text x="12" y="286" font-size="14">12px text padding</text></g><g transform="translate(460 76)"><rect width="220" height="230.67" rx="12" fill="white" stroke="#aebaca"/><rect x="8" y="8" width="204" height="130.67" fill="#dbe9f8"/><text x="110" y="70" text-anchor="middle" font-size="20">3:2 media</text><text x="110" y="99" text-anchor="middle" font-size="14">Same fitting inset</text><path d="M0 146.67h220" stroke="#aebaca"/><text x="12" y="172.67" font-size="12" fill="#2369ad">EYEBROW ROW</text><text x="12" y="192.67" font-size="14">Same two title lines</text><text x="12" y="212.67" font-size="14">Same text padding</text></g><text x="32" y="420" font-size="14">Choose one media ratio per collection. All cards in that collection share the text reserve.</text></g></svg>
