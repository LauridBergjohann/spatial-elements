<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
<title id="title">Natural summary height with container-driven internal columns</title><desc id="description">The same six content blocks appear in one, two and three columns. Panel height is natural rather than fixed across the three examples.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18344b;font-size:18px}.title{font-size:23px;font-weight:600}.panel{fill:white;stroke:#577a96;stroke-width:2}.tile{fill:#c1dced;rx:5}</style>
<rect width="1200" height="520" fill="#fafcfe"/><text class="title" x="32" y="42">Custom content can respond to summary width without imposing a universal height</text>
<text x="32" y="88">Narrow · one column</text><rect class="panel" x="32" y="110" width="220" height="358" rx="16"/>
<g class="tile"><rect x="48" y="126" width="188" height="42"/><rect x="48" y="184" width="188" height="42"/><rect x="48" y="242" width="188" height="42"/><rect x="48" y="300" width="188" height="42"/><rect x="48" y="358" width="188" height="42"/><rect x="48" y="416" width="188" height="36"/></g>
<text x="300" y="88">Medium · two columns</text><rect class="panel" x="300" y="110" width="348" height="226" rx="16"/>
<g class="tile"><rect x="316" y="126" width="150" height="54"/><rect x="482" y="126" width="150" height="54"/><rect x="316" y="196" width="150" height="54"/><rect x="482" y="196" width="150" height="54"/><rect x="316" y="266" width="150" height="54"/><rect x="482" y="266" width="150" height="54"/></g>
<text x="696" y="88">Wide · three columns</text><rect class="panel" x="696" y="110" width="472" height="156" rx="16"/>
<g class="tile"><rect x="712" y="126" width="136" height="54"/><rect x="864" y="126" width="136" height="54"/><rect x="1016" y="126" width="136" height="54"/><rect x="712" y="196" width="136" height="54"/><rect x="864" y="196" width="136" height="54"/><rect x="1016" y="196" width="136" height="54"/></g>
<text x="300" y="386">Author-defined container queries control the internal layout.</text><text x="300" y="417">The framework supplies width, placement and overflow policy.</text><text x="32" y="503">Schematic custom snippet; these column switches are not mandatory framework breakpoints.</text>
</svg>
