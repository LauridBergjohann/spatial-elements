<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title description">
<title id="title">Ultra-wide input ownership</title><desc id="description">With 3D selected the left free area controls the model and the right pane scrolls. Images and video allow document scrolling. With the pane hidden all free space controls 3D. Real controls always take priority.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18344b;font-size:17px}.title{font-size:23px;font-weight:600}.screen{fill:#e6edf3;stroke:#718da3;stroke-width:2}.model{fill:#afd4eb}.scroll{fill:#d1e4d7}.control{fill:#fff}</style>
<rect width="1200" height="350" fill="#fafcfe"/><text class="title" x="32" y="40">The gesture owner is chosen at contact start</text>
<text x="32" y="82">3D + visible pane</text><rect class="screen" x="32" y="100" width="352" height="180" rx="12"/><rect class="model" x="44" y="144" width="154" height="122"/><rect class="scroll" x="210" y="144" width="162" height="122"/><rect class="control" x="92" y="112" width="234" height="22" rx="5"/><text x="65" y="203">Rotate 3D</text><text x="230" y="203">Scroll page</text>
<text x="424" y="82">Image / video selected</text><rect class="screen" x="424" y="100" width="352" height="180" rx="12"/><rect class="scroll" x="436" y="144" width="328" height="122"/><rect class="control" x="484" y="112" width="234" height="22" rx="5"/><text x="490" y="203">Free area scrolls the page</text><rect class="control" x="454" y="237" width="132" height="18" rx="4"/>
<text x="816" y="82">3D + hidden pane</text><rect class="screen" x="816" y="100" width="352" height="180" rx="12"/><rect class="model" x="828" y="112" width="328" height="154"/><rect class="control" x="1040" y="120" width="102" height="24" rx="5"/><text x="893" y="203">Free area controls 3D</text>
<text x="32" y="324">White controls keep priority. Crossing the pane boundary does not change an already active gesture.</text>
</svg>
