<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
<title id="title">Viewport layout and container grid</title><desc id="description">An ordinary content container and a narrower detail pane choose independent grids. Four rows illustrate 4, 6, 8 and 12 columns.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18344b} .label{font-size:19px;font-weight:600}.small{font-size:16px}.outer{fill:#e7edf2;stroke:#8ba4b8;stroke-width:2}.content{fill:#fff;stroke:#27688e;stroke-width:2}.col{fill:#a9d0e5;stroke:#fff;stroke-width:4}</style>
<rect width="1200" height="620" fill="#fafcfe"/><text class="label" x="32" y="38">One viewport composition; each content container selects its own grid</text>
<rect class="outer" x="32" y="68" width="552" height="164" rx="12"/><rect class="content" x="108" y="112" width="400" height="84" rx="4"/>
<text class="small" x="48" y="94">ContentPage · centered container</text><text class="label" x="225" y="161">Grid L · 12 columns</text>
<rect class="outer" x="616" y="68" width="552" height="164" rx="12"/><rect class="content" x="900" y="112" width="244" height="84" rx="4"/>
<text class="small" x="632" y="94">Detail 3XL · right pane</text><text class="small" x="672" y="162">Media area</text><text class="label" x="930" y="161">Grid M · 8 columns</text>
<text class="label" x="32" y="282">Container query width is measured before section padding</text>
<g transform="translate(32 312)"><text class="small" y="28">XS · &lt;600 · 12px gap</text><rect class="content" x="248" width="888" height="48"/><g class="col"><rect x="260" y="10" width="207" height="28"/><rect x="479" y="10" width="207" height="28"/><rect x="698" y="10" width="207" height="28"/><rect x="917" y="10" width="207" height="28"/></g></g>
<g transform="translate(32 378)"><text class="small" y="28">S · 600–839 · 16px gap</text><rect class="content" x="248" width="888" height="48"/><g class="col"><rect x="264" y="10" width="129" height="28"/><rect x="409" y="10" width="129" height="28"/><rect x="554" y="10" width="129" height="28"/><rect x="699" y="10" width="129" height="28"/><rect x="844" y="10" width="129" height="28"/><rect x="989" y="10" width="129" height="28"/></g></g>
