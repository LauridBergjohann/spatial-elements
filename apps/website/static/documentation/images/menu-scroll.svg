<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
<title id="title">Bounded sticky menu at four scroll positions</title><desc id="description">At scroll positions 0, 16 and 32 the menu offset remains zero. At 80 it moves upward 48 pixels. Detail 3XL stays fixed.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18344b;font-size:18px}.title{font-size:23px;font-weight:600}.screen{fill:#e6edf3;stroke:#718da3;stroke-width:2}.menu{fill:#fff;stroke:#27688e;stroke-width:2}.content{fill:#bcd8e8}</style>
<rect width="1200" height="340" fill="#fafcfe"/><text class="title" x="32" y="40">The menu is bounded by scroll position, not scroll direction</text>
<defs><clipPath id="last"><rect x="920" y="104" width="248" height="140" rx="8"/></clipPath></defs>
<g><text x="32" y="86">Scroll 0</text><rect class="screen" x="32" y="104" width="248" height="140" rx="8"/><rect class="menu" x="48" y="120" width="216" height="64" rx="10"/><rect class="content" x="48" y="188" width="216" height="42"/><text x="32" y="276">Offset 0px</text></g>
<g><text x="328" y="86">Scroll 16</text><rect class="screen" x="328" y="104" width="248" height="140" rx="8"/><rect class="content" x="344" y="144" width="216" height="86"/><rect class="menu" x="344" y="120" width="216" height="64" rx="10"/><text x="328" y="276">Offset 0px</text></g>
<g><text x="624" y="86">Scroll 32</text><rect class="screen" x="624" y="104" width="248" height="140" rx="8"/><rect class="content" x="640" y="128" width="216" height="102"/><rect class="menu" x="640" y="120" width="216" height="64" rx="10"/><text x="624" y="276">Offset 0px</text></g>
<g><text x="920" y="86">Scroll 80</text><rect class="screen" x="920" y="104" width="248" height="140" rx="8"/><g clip-path="url(#last)"><rect class="content" x="936" y="112" width="216" height="118"/><rect class="menu" x="936" y="72" width="216" height="64" rx="10"/></g><text x="920" y="276">Offset -48px</text></g>
<text x="32" y="322">Schematic XL menu. Detail 3XL is fixed and keeps offset 0 at every document scroll position.</text>
</svg>

