<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">One website, two complementary layers</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#24836e"/></marker></defs><style>svg{background:#eef3f1;font-family:system-ui,sans-serif}rect{fill:#fff;stroke:#bfd0c9;stroke-width:2}text{fill:#1b3932;font-size:21px;font-weight:600}.small{font-size:17px;font-weight:400;fill:#45645c}.accent{fill:#d4eee4;stroke:#24836e}.muted{fill:#e2e9e6}.arrow{fill:none;stroke:#24836e;stroke-width:3}.model{fill:#4db197;stroke:#19715d;stroke-width:2}.edge{fill:none;stroke:#19715d;stroke-width:2}</style><text x="32" y="38" class="">One website, two complementary layers</text><rect x="32" y="72" width="548" height="126" rx="12" class="accent"/><text x="52" y="105" class="">Page Sections · the content foundation</text><text x="52" y="134" class="small">HTML • headings • cards • content grid</text><text x="52" y="165" class="small">Responsive widths, surfaces and navigation</text><rect x="32" y="226" width="548" height="126" rx="12" class=""/><text x="52" y="259" class="">Spatial Elements · the spatial layer</text><text x="52" y="288" class="small">Models • collection interactions • detail views</text><text x="52" y="319" class="small">One shared stage, with HTML and poster fallback</text><rect x="646" y="72" width="282" height="280" rx="12" class=""/><text x="666" y="105" class="">Your page</text><rect x="666" y="128" width="242" height="42" rx="12" class="muted"/><g transform="translate(787 236) scale(0.85)"><path d="M0 -46 44 -22 44 28 0 52 -44 28 -44 -22Z" class="model"/><path d="M-44 -22 0 2 44 -22M0 2V52" class="edge"/></g><text x="676" y="324" class="small">Content + 3D</text><path d="M590 134 L635 182" class="arrow" marker-end="url(#arrow)"/><path d="M590 287 L635 242" class="arrow" marker-end="url(#arrow)"/><text x="32" y="402" class="small">A section is a meaningful part of a page. A stage renders its spatial content.</text></svg>
