<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">One element document, two presentations</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#24836e"/></marker></defs><style>svg{background:#eef3f1;font-family:system-ui,sans-serif}rect{fill:#fff;stroke:#bfd0c9;stroke-width:2}text{fill:#1b3932;font-size:21px;font-weight:600}.small{font-size:17px;font-weight:400;fill:#45645c}.accent{fill:#d4eee4;stroke:#24836e}.muted{fill:#e2e9e6}.arrow{fill:none;stroke:#24836e;stroke-width:3}.model{fill:#4db197;stroke:#19715d;stroke-width:2}.edge{fill:none;stroke:#19715d;stroke-width:2}</style><text x="32" y="38" class="">One element document, two presentations</text><rect x="32" y="82" width="310" height="270" rx="12" class="accent"/><text x="52" y="115" class="">SpatialElementData</text><text x="52" y="156" class="small">id + title</text><text x="52" y="198" class="small">geometry: low + high</text><text x="52" y="240" class="small">hdr + fallbackImage</text><text x="52" y="282" class="small">features + media + action</text><rect x="468" y="82" width="460" height="126" rx="12" class=""/><text x="488" y="115" class="">Collection: SpatialListItem[]</text><text x="488" y="149" class="small">getSpatialListItems(elements, routePrefix)</text><text x="488" y="180" class="small">CardGrid or Carousel → native detail links</text><rect x="468" y="252" width="460" height="100" rx="12" class=""/><text x="488" y="285" class="">Detail: SpatialElementPage</text><text x="488" y="316" class="small">The original element + your content sections</text><path d="M354 158 L456 145" class="arrow" marker-end="url(#arrow)"/><path d="M354 281 L456 300" class="arrow" marker-end="url(#arrow)"/><text x="32" y="408" class="small">The layout shares appearance. Each route supplies the content it actually needs.</text>