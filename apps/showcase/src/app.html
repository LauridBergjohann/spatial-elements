<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			(function () {
				var choice;
				try { choice = sessionStorage.getItem('spatial-showcase-appearance'); } catch (_) {}
				var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				var root = document.documentElement;
				root.dataset.theme = dark ? 'dark' : 'light';
				root.dataset.themePending = '';
				root.style.colorScheme = root.dataset.theme;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
