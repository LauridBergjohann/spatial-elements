name: Verify packages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build:apps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep "without JavaScript|GPU unavailable"
      - run: npm run test:apps
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-output
          path: |
            test-results/
            .artifacts/packages/*.log
