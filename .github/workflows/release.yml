name: Release packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container:
      # Keep aligned with @playwright/test and package-lock.json (check:ci).
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Check trusted publishing setup
        run: |
          if [ '${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED }}' != 'true' ]; then
            echo '::error::Configure npm trusted publishers and the npm environment first. See docs/release.md.'
            exit 1
          fi
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run verify
      - run: npm run build:apps
      - run: npm run check:docs
      - run: npm run test:e2e -- --grep "without JavaScript|GPU unavailable"
      - run: npm run test:apps
      - run: npm run release:publish
      - run: npm run verify:published
      - uses: actions/upload-artifact@v6
        if: always() && (hashFiles('.artifacts/packages/*consumer.json') != '' || hashFiles('test-results/**') != '' || hashFiles('.artifacts/apps-preview/**') != '')
        with:
          name: published-consumer
          include-hidden-files: true
          path: |
            .artifacts/packages/*consumer.json
            test-results/
            .artifacts/apps-preview/
