name: Release packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        id: changesets
        with:
          version: npm run release:version
          title: 'chore: release Spatial Elements'
          commit: 'chore: version Spatial Elements'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
  plan:
    needs: version
    if: needs.version.outputs.has_changesets == 'false'
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run release:plan
        id: plan
      - name: Explain missing publishing setup
        if: steps.plan.outputs.pending == 'true' && vars.NPM_TRUSTED_PUBLISHING_ENABLED != 'true'
        run: |
          echo "::error::Configure npm Trusted Publishing and set NPM_TRUSTED_PUBLISHING_ENABLED=true."
          exit 1
  publish:
    needs: plan
    if: needs.plan.outputs.pending == 'true' && vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run verify
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep "without JavaScript|GPU unavailable"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages-${{ github.sha }}
          path: .artifacts/packages/*.tgz
          if-no-files-found: error
      - run: npm run release:publish
